<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #212121;
            color: #C5A065;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .loader {
            border: 4px solid #333;
            border-top: 4px solid #C5A065;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .text-muted {
            color: #666 !important;
        }
    </style>
</head>

<body>
    <div class="text-center">
        <!-- Loader / Status -->
        <div id="loader-container">
            <div id="spinner" class="loader"></div>
            <h5 id="status">Проверка доступа...</h5>
        </div>

        <!-- Widget Container (Hidden by default) -->
        <div id="widget-container" style="display: none; margin-top: 20px;">
            <p class="text-muted mb-3">Для доступа к сайту необходимо авторизоваться</p>
            <script async src="https://telegram.org/js/telegram-widget.js?22" data-telegram-login="{{ bot_username }}"
                data-size="large" data-onauth="onTelegramAuth(user)" data-request-access="write"></script>
        </div>

        <div id="error" class="text-danger mt-3"
            style="{% if error_message %}display: block;{% else %}display: none;{% endif %}">
            {{ error_message }}
        </div>
    </div>

    <script>
        // Widget Auth Callback
        async function onTelegramAuth(user) {
            if (!user) return;
            document.getElementById('widget-container').style.display = 'none';
            document.getElementById('loader-container').style.display = 'block';
            document.getElementById('status').innerText = 'Вход...';

            try {
                const response = await fetch('/api/login/widget', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(user)
                });
                const result = await response.json();
                handleLoginResult(result);
            } catch (error) {
                showError('Ошибка сети: ' + error.message);
            }
        }

        function showError(msg) {
            document.getElementById('loader-container').style.display = 'none';
            document.getElementById('widget-container').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error').innerText = msg;
        }

        function handleLoginResult(result) {
            if (result.status === 'ok') {
                document.getElementById('status').innerText = 'Успешно! Перенаправление...';
                window.location.reload();
            } else {
                showError(result.message || 'Отказано в доступе');
                // Show widget again if it was a data error, unless it's a specific "No chars" error
                if (result.message && result.message.includes("не зарегистрированы")) {
                    // Keep error shown
                } else {
                    // Optional: show widget again
                    setTimeout(() => {
                        document.getElementById('widget-container').style.display = 'block';
                    }, 2000);
                }
            }
        }

        document.addEventListener('DOMContentLoaded', async function () {
            const tg = window.Telegram.WebApp;
            tg.ready();

            // 1. Check if opened inside Telegram (WebApp)
            if (tg.initData) {
                // WebApp Login
                try {
                    const response = await fetch('/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ initData: tg.initData })
                    });
                    const result = await response.json();
                    handleLoginResult(result);
                } catch (e) {
                    showError('Ошибка сети (WebApp): ' + e.message);
                }
            } else {
                // 2. Not in Telegram -> Show Widget
                document.getElementById('loader-container').style.display = 'none';
                document.getElementById('widget-container').style.display = 'block';
            }
        });
    </script>
</body>

</html>
