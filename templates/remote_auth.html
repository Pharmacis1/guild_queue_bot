<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Browser Auth</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .browser-container {
            position: relative;
            border: 2px solid #333;
            margin-top: 20px;
            cursor: pointer;
        }

        #browserStream {
            display: block;
            max-width: 1280px;
            max-height: 720px;
            width: 100%;
            height: auto;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 1280px;
            justify-content: center;
            background: #1e1e1e;
            padding: 10px;
            border-radius: 8px;
        }

        .status-bar {
            width: 100%;
            background: #d32f2f;
            color: white;
            text-align: center;
            font-size: 0.8rem;
            padding: 2px;
        }
    </style>
</head>

<body>

    {% if is_admin %}
    <div class="status-bar" id="statusBar">REMOTE ADMIN SESSION - DO NOT SHARE THIS URL</div>

    <div class="browser-container" id="browserContainer">
        <img id="browserStream" src="" alt="Browser Stream (Click Start)">
        <div id="loadingOverlay"
            style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); color:white; justify-content:center; align-items:center; flex-direction:column;">
            <div class="spinner-border text-primary" role="status"></div>
            <div id="loadingText" style="margin-top:10px;">Starting...</div>
        </div>
        <div id="errorOverlay"
            style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(50,0,0,0.9); color:#ff6b6b; justify-content:center; align-items:center; flex-direction:column; padding:20px; text-align:center;">
            <h3>Session Error</h3>
            <p id="errorText">Unknown Error</p>
            <button class="btn btn-sm btn-outline-light mt-3" onclick="stopSession()">Reset</button>
        </div>
    </div>

    <div class="controls">
        <button class="btn btn-success" onclick="startSession()">▶ START Session</button>
        <button class="btn btn-warning" onclick="refreshImage()">🔄 Refresh Img</button>

        <input type="text" id="typeInput" class="form-control" style="max-width: 200px;"
            placeholder="Type text here...">
        <button class="btn btn-primary" onclick="sendText()">Type</button>
        <button class="btn btn-secondary" onclick="sendKey('Enter')">Enter</button>
        <button class="btn btn-secondary" onclick="sendKey('Backspace')">⌫</button>
        <button class="btn btn-secondary" onclick="sendKey('Tab')">Tab</button>

        <button class="btn btn-info" onclick="triggerScan()">🔍 Run Scan</button>
        <button class="btn btn-success" onclick="saveOnly()">💾 SAVE</button>
        <button class="btn btn-danger" onclick="stopSession(true)">⏹ SAVE & STOP</button>
    </div>
    {% else %}
    <div class="auth-container">
        <div class="spider-logo">🚫</div>
        <h2>Access Denied</h2>
        <p class="text-danger">You do not have permission to view this page.</p>
        <a href="/" class="btn btn-outline-light mt-3">Return Home</a>
    </div>
    {% endif %}

    <script>
        let isRunning = false;
        let refreshInterval = null;
        let statusInterval = null;

        const img = document.getElementById('browserStream');
        const container = document.getElementById('browserContainer');
        const overlay = document.getElementById('loadingOverlay');
        const errorOverlay = document.getElementById('errorOverlay');
        const errorText = document.getElementById('errorText');
        const statusBar = document.getElementById('statusBar');

        async function startSession() {
            overlay.style.display = 'flex';
            errorOverlay.style.display = 'none';
            try {
                const res = await fetch('/api/browser/start', { method: 'POST' });
                const data = await res.json();
                if (data.status === 'ok') {
                    isRunning = true;
                    // Start polling status to know when ready or failed
                    statusInterval = setInterval(checkStatus, 1000);
                    startPolling();
                } else {
                    alert('Error: ' + data.message);
                    overlay.style.display = 'none';
                }
            } catch (e) {
                alert('Network Error: ' + e);
                overlay.style.display = 'none';
            }
        }

        async function checkStatus() {
            try {
                const res = await fetch('/api/browser/status');
                const data = await res.json();

                if (data.last_error) {
                    showError(data.last_error);
                    return;
                }

                if (data.active) {
                    overlay.style.display = 'none';
                    statusBar.style.background = '#2e7d32'; // Green
                    statusBar.textContent = "SESSION ACTIVE - REMOTE CONTROL ENABLED";
                } else if (isRunning && !data.active) {
                    // It died unexpectedly without error?
                    // Or just haven't started yet?
                    // We keep waiting unless it takes too long
                }
            } catch (e) {
                console.error("Status check failed", e);
            }
        }

        function showError(msg) {
            isRunning = false;
            clearInterval(refreshInterval);
            clearInterval(statusInterval);
            overlay.style.display = 'none';
            errorOverlay.style.display = 'flex';
            errorText.textContent = msg;
            statusBar.style.background = '#d32f2f';
            statusBar.textContent = "SESSION CRASHED";
        }

        async function stopSession(save = false) {
            clearInterval(refreshInterval);
            clearInterval(statusInterval);
            overlay.style.display = 'none';
            errorOverlay.style.display = 'none';

            try {
                const url = '/api/browser/stop' + (save ? '?save=true' : '');
                const res = await fetch(url, { method: 'POST' });
                const data = await res.json();
                statusBar.style.background = '#d32f2f'; // Red
                statusBar.textContent = "SESSION STOPPED" + (save ? " & SAVED" : "");
                img.src = "";
                isRunning = false;
                if (save) alert("Session saved and stopped!");
            } catch (e) { alert('Network Error: ' + e); }
        }

        function startPolling() {
            if (refreshInterval) clearInterval(refreshInterval);
            refreshImage();
            refreshInterval = setInterval(refreshImage, 1000);
        }

        async function saveOnly() {
            try {
                const res = await fetch('/api/browser/save', { method: 'POST' });
                const data = await res.json();
                alert(data.message);
            } catch (e) { alert('Network Error: ' + e); }
        }

        async function triggerScan() {
            if (!confirm("Start background scan? This might take a few minutes.")) return;
            try {
                const res = await fetch('/api/scan/players', { method: 'POST' });
                const data = await res.json();
                alert(data.message);
            } catch (e) { alert('Network Error: ' + e); }
        }

        function refreshImage() {
            if (!isRunning) return;
            // Add timestamp to prevent caching
            // We use a separate Image object to preload to avoid flickering, theoretically, 
            // but for MJPEG style simple img src replacement is okay.
            const newSrc = '/api/browser/screenshot?t=' + new Date().getTime();

            // On error(404/503) the browser logs it to console, but image stays broken icon.
            // We rely on checkStatus to catch the actual error reason.
            img.src = newSrc;
        }

        // Click Handling
        img.addEventListener('click', async (e) => {
            if (!isRunning) return;

            // Get coordinates relative to the IMAGE
            const rect = img.getBoundingClientRect();

            // Current displayed size
            const displayedWidth = rect.width;
            const displayedHeight = rect.height;

            // Click position relative to element
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            // Natural size (1280x720 usually)
            // If image is not loaded, naturalWidth is 0.
            const naturalWidth = img.naturalWidth || 1280;
            const naturalHeight = img.naturalHeight || 720;

            // Scale factor
            const scaleX = naturalWidth / displayedWidth;
            const scaleY = naturalHeight / displayedHeight;

            const finalX = Math.round(clickX * scaleX);
            const finalY = Math.round(clickY * scaleY);

            console.log(`Click: ${finalX}, ${finalY}`);

            await fetch('/api/browser/interact', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type: 'click', x: finalX, y: finalY })
            });

            // Refresh quicker after click
            setTimeout(refreshImage, 200);
            setTimeout(refreshImage, 500);
        });

        async function sendText() {
            const text = document.getElementById('typeInput').value;
            if (!text) return;

            await fetch('/api/browser/interact', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type: 'type', text: text })
            });
            document.getElementById('typeInput').value = '';
            setTimeout(refreshImage, 500);
        }

        async function sendKey(key) {
            await fetch('/api/browser/interact', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ type: 'press', key: key })
            });
            setTimeout(refreshImage, 500);
        }

    </script>
</body>

</html>
