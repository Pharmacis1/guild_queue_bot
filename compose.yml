services:
  bot:
    image: hyperf0rm/guild_queue_bot:latest
    restart: always
    ports:
      - "8082:8081"
    volumes:
      - ./guild_bot.db:/app/guild_bot.db
      - ./backups:/app/backups
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json
      - ./pwobs_auth.json:/app/pwobs_auth.json
    env_file:
      - .env
    environment:
      - WEB_PORT=8081

  frontend:
    image: hyperf0rm/guild_queue_bot:frontend
    restart: always
    ports:
      - "8081:3000"
    depends_on:
      - bot
