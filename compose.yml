services:
  bot:
    image: hyperf0rm/guild_queue_bot:latest
    restart: always
    ports:
      - "8001:8081"
    depends_on:
      - db
    volumes:
      - ./backups:/app/backups
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json
      - ./pwobs_auth.json:/app/pwobs_auth.json
    env_file:
      - .env
    environment:
      - WEB_PORT=8081

  frontend:
    image: hyperf0rm/guild_queue_bot:frontend
    restart: always
    env_file:
      - .env
    ports:
      - "3000:3000"
    depends_on:
      - bot

  db:
    image: postgres:16-alpine
    restart: always
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - guild_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  guild_db_data:
